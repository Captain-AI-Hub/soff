name: CI / Release

on:
  workflow_dispatch:
    inputs:
      release_name:
        description: Optional tag/release name; leave empty to run CI only
        required: false
        default: ""
        type: string

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_suffix: windows-x64
            build_command: pwsh scripts/build.ps1 -IdaPlugin -DesktopBundles nsis
            plugin_name: soff.dll
            cli_name: soff_cli.exe
            ffi_name: soff_ffi.dll
            bundle_glob: desktop/src-tauri/target/release/bundle/nsis/*.exe
          - os: ubuntu-latest
            artifact_suffix: linux-x64
            build_command: sh scripts/build.sh --ida-plugin --desktop-bundles deb
            plugin_name: soff.so
            cli_name: soff_cli
            ffi_name: libsoff_ffi.so
            bundle_glob: desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: ubuntu-24.04-arm
            artifact_suffix: linux-arm64
            build_command: sh scripts/build.sh --desktop-bundles deb
            plugin_name: ""
            cli_name: soff_cli
            ffi_name: libsoff_ffi.so
            bundle_glob: desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: macos-latest
            artifact_suffix: macos-arm64
            build_command: sh scripts/build.sh --ida-plugin --desktop-bundles dmg
            plugin_name: soff.dylib
            cli_name: soff_cli
            ffi_name: libsoff_ffi.dylib
            bundle_glob: desktop/src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: 3.0.8

      - name: Install system deps (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            xdg-utils \
            patchelf

      - name: Install SQLite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://www.sqlite.org/2024/sqlite-dll-win-x64-3470200.zip"
          Invoke-WebRequest -Uri $url -OutFile sqlite.zip
          Expand-Archive sqlite.zip -DestinationPath sqlite
          Copy-Item sqlite\sqlite3.dll -Destination C:\Windows\System32\

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Install desktop dependencies
        working-directory: desktop
        run: bun install --frozen-lockfile

      - name: Check Rust formatting
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check

      - name: Run Rust clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Rust tests
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

      - name: Check frontend
        working-directory: desktop
        run: bun run build

      - name: Build soff and desktop bundles
        run: ${{ matrix.build_command }}

      - name: Test native smoke
        run: xmake run soff_smoke

      - name: Re-run local real-export calibration fixture
        run: xmake run soff_cli check-m5-fixture tests/fixtures/local_m6_nullfix_recalibration.json --out build/local_m6_nullfix_recalibration.soff

      - name: Collect native artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/native
          if [ -n "${{ matrix.plugin_name }}" ]; then
            plugin=$(find build -type f -name "${{ matrix.plugin_name }}" -print -quit)
            test -n "$plugin"
            cp "$plugin" dist/native/
          fi
          cli=$(find build -type f -name "${{ matrix.cli_name }}" -print -quit)
          ffi=$(find build -type f -name "${{ matrix.ffi_name }}" -print -quit)
          test -n "$cli"
          test -n "$ffi"
          cp "$cli" dist/native/
          cp "$ffi" dist/native/

      - name: Upload native artifacts
        uses: actions/upload-artifact@v4
        with:
          name: soff-${{ matrix.artifact_suffix }}
          path: dist/native/
          if-no-files-found: error

      - name: Upload desktop installer
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.artifact_suffix }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error

  release:
    if: ${{ inputs.release_name != '' }}
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release

          copy_required() {
            src="$1"
            dst="$2"
            if ! compgen -G "$src" > /dev/null; then
              echo "Required release artifact is missing: $src" >&2
              exit 1
            fi
            matches=( $src )
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "Expected exactly one release artifact for $src, found ${#matches[@]}" >&2
              exit 1
            fi
            cp "${matches[0]}" "$dst"
          }

          copy_required "artifacts/soff-windows-x64/soff.dll" "release/soff-windows-x64.dll"
          copy_required "artifacts/soff-windows-x64/soff_cli.exe" "release/soff_cli-windows-x64.exe"
          copy_required "artifacts/soff-windows-x64/soff_ffi.dll" "release/soff_ffi-windows-x64.dll"

          copy_required "artifacts/soff-linux-x64/soff.so" "release/soff-linux-x64.so"
          copy_required "artifacts/soff-linux-x64/soff_cli" "release/soff_cli-linux-x64"
          copy_required "artifacts/soff-linux-x64/libsoff_ffi.so" "release/libsoff_ffi-linux-x64.so"

          copy_required "artifacts/soff-linux-arm64/soff_cli" "release/soff_cli-linux-arm64"
          copy_required "artifacts/soff-linux-arm64/libsoff_ffi.so" "release/libsoff_ffi-linux-arm64.so"

          copy_required "artifacts/soff-macos-arm64/soff.dylib" "release/soff-macos-arm64.dylib"
          copy_required "artifacts/soff-macos-arm64/soff_cli" "release/soff_cli-macos-arm64"
          copy_required "artifacts/soff-macos-arm64/libsoff_ffi.dylib" "release/libsoff_ffi-macos-arm64.dylib"

          copy_required "artifacts/desktop-windows-x64/*.exe" "release/soff-desktop-windows-x64-setup.exe"
          copy_required "artifacts/desktop-linux-x64/*.deb" "release/soff-desktop-linux-x64.deb"
          copy_required "artifacts/desktop-linux-arm64/*.deb" "release/soff-desktop-linux-arm64.deb"
          copy_required "artifacts/desktop-macos-arm64/*.dmg" "release/soff-desktop-macos-arm64.dmg"

          find release -maxdepth 1 -type f -print | sort

      - name: Create tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_NAME: ${{ inputs.release_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_NAME" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_NAME" \
            --generate-notes \
            release/*
